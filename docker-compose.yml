services:
  api:
    build: api/server
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
