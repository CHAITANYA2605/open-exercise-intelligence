name: Validate Dataset

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Exercise Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate exercise schema and data integrity
        run: node scripts/validate.js

      - name: Run taxonomy regression tests
        run: node tests/taxonomy.test.js

      - name: Run dataset health checks
        run: node scripts/check-dataset.js

      - name: Build dataset artifacts
        run: node scripts/generation/build-dataset.js

      - name: Print dataset statistics
        run: node scripts/admin/stats.js
