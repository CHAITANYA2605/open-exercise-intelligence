[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "oei-exercise-sdk"
version = "1.0.0"
description = "Open Exercise Intelligence — Python SDK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["exercise", "fitness", "open-source", "oei"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/CHAITANYA2605/open-exercise-intelligence"
Repository = "https://github.com/CHAITANYA2605/open-exercise-intelligence"

[tool.setuptools.packages.find]
where = ["src"]
